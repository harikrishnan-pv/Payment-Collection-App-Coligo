services:
  postgres:
    image: postgres:16
    container_name: coligo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coligo
      POSTGRES_PASSWORD: coligo_dev_2026
      POSTGRES_DB: coligo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coligo -d coligo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
