# /etc/nginx/conf.d/coligo.conf — API reverse proxy + static landing page.
# Provisioned once on the EC2 instance (see README "Deployment").

server {
    listen 80;
    server_name _;

    # Landing page at /
    root /var/www/coligo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API under /api/* -> Express on :3000, prefix stripped
    # (Express itself serves the exact test-mandated paths: /customers, /payments)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
